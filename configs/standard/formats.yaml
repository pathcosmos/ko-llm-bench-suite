# 사용자 모델 학습 형식 (Goal 1-A, 2026-11-18 검증)
# 평가 경로(vLLM / lm-eval / llama.cpp / Ollama / EVAFRILL 엔진)는 이 파일만 보고 프롬프트·토큰을 만든다.
# 근거 경로 약어
#   FS  = FRANKENSTALLM @50c6143 (github.com/pathcosmos/FRANKENSTALLM, 로컬: ../llm-traditional/.cache/references/FRANKENSTALLM)
#   FSH = HF pathcosmos/frankenstallm @b9f7777 (data/*.py는 FS에 없는 학습 데이터 코드)
#   EV  = EVAFRILL-Mo @7e9c538 (github.com/pathcosmos/EVAFRILL-Mo, 로컬: $LT_SRC/EVAFRILL-Mo)
#   LT  = llm-traditional @88af514 (공개 소스판: github.com/pathcosmos/korean-dense-llm)
#   TRL = trl 0.29.0 wheel (frankenstallm ORPO가 사용)

tokenizers:
  korean_sp_unigram64k:
    # frankenstallm·EVAFRILL의 SFT/DPO/ORPO와 한국어 사전학습 주력 경로가 쓴 토크나이저
    sha256: f413abc0436fab513d15f4e8a1c7d5ca4ebc53adc4faf3f8ce1d66df4257b10a
    sources:   # 같은 바이트의 파일이 있는 곳 (앞에서부터 찾는다)
      - ${HF_HOME}/hub/models--pathcosmos--EVAFRILL-Mo-3B/snapshots/e95edece955af9df9a6215210db594a9984fddf5/tokenizer.json
      - /home/work/llm-dense/llm-traditional/.cache/references/FRANKENSTALLM/tokenizer/korean_sp/tokenizer.json
    special: {pad: 0, bos: 1, eos: 2, unk: 3}
    evidence:
      - "EV train/sft.py:345, train/dpo.py:184, train/orpo_native.py:169, train_3b_orpo_1gpu.sh:24 — 기본 tokenizer/korean_sp/tokenizer.json"
      - "FS train/sft.py:196-202 (base ckpt의 tokenizer.json → korean_sp), scripts/convert_to_hf.py:173-175 (HF export에 korean_sp 복사 → ORPO의 AutoTokenizer)"
      - "EV data/finish_korean_pipeline.sh:163 (korean_train.bin 생성 TOKENIZER)"
      - "EV HF 체크포인트 8개 tokenizer.json 모두 이 SHA"
    notes:
      - "Unigram 64000, Metaspace(▁, prepend_scheme=always), normalizer 없음, post_processor 없음(BOS/EOS 자동 추가 없음)"
      - "개행·탭은 어휘에 없어 <unk>(3)로 인코딩된다: 'a\\nb'→[▁a,<unk>,b], '\\n\\n'·'\\t'도 <unk> 하나. 학습 템플릿의 개행도 모두 <unk>로 학습됨. decode하면 사라진다 (runs/format_conformance_v1/newline_unk.log)"
      - "생성 결과의 <unk>(3) 처리(예: '\\n'으로 복원)는 Goal 2에서 dev로 정할 디코딩 정책이다"
      - "원본 SentencePiece(korean_sp/tokenizer.model)는 NFKC+공백정리를 하므로 1802문장 중 69개에서 분절이 다름(53 NFKC, 16 공백). SP 경로(EV data/tokenize_extra.py)는 일부 추가 데이터에만 쓰였을 가능성"
  frankenstallm_release_bytefallback:
    # HF frankenstallm 배포 tokenizer.json — 학습 후(2026-03-26, FS commit 9584272) byte-fallback 256개를 붙여 다시 만든 것
    sha256: 531b3f3e3af45b9b881731683b8c68554c598ab641f3d22a23c5bd98f047a4b8
    use: false
    reason: >-
      어휘 64000개와 ID는 korean_sp와 같고 분절도 같지만, 사전에 없는 문자를 <unk>(3) 대신 byte 토큰(64000-64255)으로 바꾼다.
      이 byte 토큰 임베딩은 학습되지 않았다(노름 0.855±0.009 vs 일반 토큰 2.33±0.20, tied). 1802문장 중 92개가 다르고
      92개 모두 byte 토큰을 <unk>로 바꾸면 korean_sp와 같아진다 (runs/format_conformance_v1/tokenizer_diff_causes.log).
  jansori_bbpe65k:
    sha256: 050f9b43cf964f0c3b29ae443a1c2eae46cb2ee0022cc010bcfea3d26acf1706
    sources:
      - /home/work/llm-dense/llm-traditional/runs/3b_47k_hub_release_v1/nfs-release-v1/bf16/tokenizer.json
    special: {bos: 0, eos: 1, pad: 2, im_start: 3, im_end: 4}
    evidence:
      - "LT runs/f6_tokens_v1/counts.json tokenizer_sha256 = 위 SHA (학습 토큰 샤드 생성에 쓴 파일과 배포본이 바이트 동일)"
      - "LT docs/PLAN.md:52 byte-level BPE 65536, 숫자 한 자리 분리, normalizer 없음"

models:
  jansori-bf16:
    kind: base
    tokenizer: jansori_bbpe65k
    pretrain:
      doc_format: "ids + [eos]"            # BOS 없음
      evidence:
        - "LT data/tokenize_shards.py:63 eos = token_to_id('<|eos|>'), :116 encode_batch(add_special_tokens=False), :126 ids.extend(encoding.ids); ids.append(eos)"
        - "LT train/data.py:1-3,67 연결된 토큰열에서 임의 위치 창(window) 샘플링 → 문서 시작은 대부분 EOS 바로 뒤"
    chat: null                              # SFT 없음 (LT CLAUDE.md: sft/ 미구현). 생성은 원문 이어쓰기
    loglik_doc_start:
      candidates: [none, eos]               # Goal 2에서 dev로 결정
      training_like: eos
    stop_token_ids: [1]
  frankenstallm-bf16:
    kind: instruct
    tokenizer: korean_sp_unigram64k         # 배포 tokenizer.json 대신 학습 당시 토크나이저 (위 reason)
    pretrain:
      doc_format: "혼합: 주력 한국어 소스는 구분 토큰 없이 연결, 일부(tokenize_extra.py) EOS 구분 가능"
      evidence:
        - "FSH data/prepare.py:69,167 tokenizer.encode(text).ids를 구분 없이 extend (EV data/prepare.py와 바이트 동일)"
        - "EV scripts/prepare_3b_data.sh:91-92,167-168,178,222,268,309,325 구분 없이 extend"
        - "EV data/tokenize_extra.py:435,523-524 eos_between_docs 기본 True (SP 경로). 어느 소스에 쓰였는지 저장소에 기록 없음"
        - "EV scripts/build_3b_dataset.sh: 17개 bin 병합 → 3b_train.bin"
    chat:
      template: user_assistant_v1
      stages:
        - "SFT: '<|user|>\\n{u}\\n<|assistant|>\\n' + '{a}</s>', prompt·response 별도 encode, 손실은 response만 (FSH data/sft_dataset.py:44-46,72-73,116-121,357-358,383-385)"
        - "ORPO(최종): TRL ORPOTrainer, 템플릿 없이 raw prompt, BOS(1) 추가, prompt+answer 결합 토큰화, EOS(2) 추가 (FS train/orpo.py:176-198,311,327; scripts/launch_3b_orpo.sh:25; data/preference/combined_preference.jsonl; TRL experimental/orpo/orpo_trainer.py:371-404,443-491, experimental/utils.py:292-323)"
        - "원저자의 ORPO 생성 평가는 '<|user|>\\n{prompt}\\n<|assistant|>\\n' 사용 (FS eval/tasks/generation_task.py:37,284-288; eval/orpo_eval_pipeline.py:269-270)"
      default: user_assistant_v1            # SFT 형식 + 원저자 평가 형식
      alternatives: [orpo_raw_bos]          # Goal 2에서 dev로 비교
    loglik_doc_start:
      candidates: [none, eos]
      training_like: none                   # 주력 사전학습 소스는 구분 없음
    stop_token_ids: [2]
  evafrill-mo-3b:
    kind: instruct
    tokenizer: korean_sp_unigram64k
    pretrain:
      doc_format: "frankenstallm과 같은 파이프라인 (혼합)"
      evidence: ["EV data/prepare.py, scripts/prepare_3b_data.sh, scripts/build_3b_dataset.sh (위와 같음)"]
    chat:
      template: user_assistant_v1
      stages:
        - "SFT: EV data/sft_dataset.py:45-47,73-74,117-122,244-245,279-285"
        - "DPO/ORPO(native): 같은 템플릿, prompt·응답 별도 encode, '</s>' (EV data/dpo_dataset.py:34-36,125-131; train/dpo.py:244; train/orpo_native.py:365)"
        - "최종(slerp) = SFT와 DPO 체크포인트 SLERP 병합 (EV scripts/merge_checkpoints.py)"
      default: user_assistant_v1
      alternatives: []
    loglik_doc_start:
      candidates: [none, eos]
      training_like: none
    stop_token_ids: [2]
  evafrill-mo-3b-pretrain:
    kind: base
    tokenizer: korean_sp_unigram64k
    pretrain:
      doc_format: "frankenstallm과 같은 파이프라인 (혼합)"
      evidence: ["EV data/prepare.py, scripts/prepare_3b_data.sh, scripts/build_3b_dataset.sh"]
    chat: null
    loglik_doc_start:
      candidates: [none, eos]
      training_like: none
    stop_token_ids: [2]

  # EVAFRILL 학습 단계 체크포인트: 최종(slerp)과 같은 학습 형식 (EV data/sft_dataset.py, dpo_dataset.py)
  evafrill-mo-3b-sft-v2: {alias_of: evafrill-mo-3b}
  evafrill-mo-3b-dpo-r1: {alias_of: evafrill-mo-3b}
  evafrill-mo-3b-dpo-r2: {alias_of: evafrill-mo-3b}
  evafrill-mo-3b-dpo-r3: {alias_of: evafrill-mo-3b}
  evafrill-mo-3b-orpo: {alias_of: evafrill-mo-3b}

  # GGUF 평가 항목 (같은 학습 형식·토크나이저)
  jansori-gguf-f16: {alias_of: jansori-bf16}
  jansori-gguf-q8_0: {alias_of: jansori-bf16}
  jansori-gguf-q4_k_m: {alias_of: jansori-bf16}
  frankenstallm-gguf-f16: {alias_of: frankenstallm-bf16}
  frankenstallm-gguf-q8_0: {alias_of: frankenstallm-bf16}
  frankenstallm-gguf-q4_k_m: {alias_of: frankenstallm-bf16}

eval_paths:
  # 2026-11-18 token_conformance.json (텍스트 24 + 대화 29, 원본 학습 코드 함수로 만든 기준값과 비교)
  vllm:
    tokenizer: "formats.prepare_tokenizer_dir(model) 디렉터리를 vLLM tokenizer 인자로 준다 (frankenstallm은 배포 tokenizer.json 사용 금지)"
    result: "3종 모두 일치 (chat 템플릿 문자열·토큰, add_special_tokens True/False 모두)"
  lmeval:
    result: "VLLM.tok_encode 3종 모두 일치"
    empty_context_prefix: "lm-eval VLLM은 빈 문맥(PPL 등)에 BOS를 붙인다(vllm_causallms.py:248-254). 3종 모두 BOS로 학습하지 않았으므로 prefix_token_id=eos를 준다"
  llamacpp:
    jansori: "배포 GGUF 그대로 일치 (문자열 /tokenize 24/24, add_special 유무 모두, BOS 추가 없음; 토큰 ID 입력 경로 24/24)"
    frankenstallm_gguf_v2_release: >-
      배포 GGUF는 불일치: BOS(1) 자동 추가, 개행을 byte 토큰(64010)으로, 분절 알고리즘도 다름(SPM 병합 vs Unigram 비터비;
      예 '어디인가요?' 학습 [43793,178] vs llama.cpp [38,13,335,178]). 텍스트 일치 8/24, 대화 0/29. 평가에 쓰지 않는다.
    frankenstallm_train_tokenizer_gguf: >-
      kobench.standard.gguf_retokenize로 만든 GGUF(가중치는 배포본과 바이트 동일, 토크나이저 메타데이터만 korean_sp UGM,
      add_space_prefix=False, BOS/EOS 자동 추가 없음) + 문자열은 formats.llamacpp_text()로 넣는다(특수 토큰으로 나눈 각 조각이
      공백으로 시작하지 않으면 앞에 공백 하나). 텍스트 24/24, 대화 29/29, 특수 토큰 경계 사례 8/8 일치
      (runs/format_conformance_v1/train_tokenizer_gguf_noprefix_check.json).
    token_id_input: >-
      llama-server /completion에 formats.encode_prompt/encode_text의 토큰 ID 배열을 직접 넣는 경로. tokens_evaluated == 입력 길이
      (JANSORI 24/24, frankenstallm 53/53), BOS를 명시적으로 붙인 입력과 출력 분포가 모두 달라 그대로 쓰임을 확인
      (llamacpp_token_id_path.json). 어떤 GGUF에서도 학습 토큰과 같다.
  ollama:
    jansori: "modelfiles/Modelfile.jansori-3b (TEMPLATE {{ .Prompt }}): Ollama 렌더링 문자열을 내부 llama-server로 토큰화한 결과 24/24 일치, prompt_eval_count 24/24"
    frankenstallm: >-
      modelfiles/Modelfile.frankenstallm-3b-v2-train-tokenizer (학습 토크나이저 GGUF + 학습 형식 템플릿 + 맨 앞 공백 하나):
      _debug_render_only로 받은 렌더링 문자열을 Ollama 내부 llama-server로 토큰화한 결과가 학습 토큰 ID와 대화 29/29 일치,
      prompt_eval_count 29/29 (runs/format_conformance_v1/ollama_train_tok/ollama_token_ids.json).
      남은 한계: user 내용 안의 특수 토큰 문자열 바로 뒤가 공백이 아니면 ▁ 하나가 다르다(Go 템플릿으로 조각별 규칙 불가).
      배포 GGUF용 Modelfile.v2-*는 템플릿만 학습 형식이고 토큰은 다르다.
    evafrill: "GGUF 없음 (Mamba-2 하이브리드는 llama.cpp 미지원) — 해당 없음"

templates:
  user_assistant_v1:
    # 학습 코드 _build_conversation_turns / _build_alpaca_turns와 같은 문자열을 만든다.
    user_tag: "<|user|>\n"
    assistant_tag: "<|assistant|>\n"
    eos_text: "</s>"
    history_turn: "{user_tag}{user}\n{assistant_tag}{assistant}\n"      # 이력에는 EOS 없음
    prompt: "{history}{user_tag}{user}\n{assistant_tag}"
    consecutive_user_join: "\n"
    alpaca_input_join: "\n"                  # instruction + '\n' + input.strip()
    system: drop                             # 학습 데이터에서 system 역할은 무시됨 (EV sft_dataset.py:103-124의 분기에 없음)
    system_alternatives: [prepend_to_first_user]   # Goal 2에서 dev로 비교
    tokenize: "prompt 문자열 전체를 한 번 encode (학습의 prompt_ids와 동일). 응답은 모델이 생성"
    bos: false
  orpo_raw_bos:
    # frankenstallm 최종 ORPO 단계의 입력 형식 (TRL tokenize_row)
    prompt: "{user}"
    bos: true
    system: "TRL 데이터 로더가 system + '\\n' + question 으로 합침 (FS train/orpo.py:176)"
