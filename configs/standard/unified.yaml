# 통일 비교 프로토콜 U (2026-11-22 등록, 측정 전 고정 — 사용자 요청: 모든 모델을 같은 조건의 한 라인에서 비교)
# 원칙: chat 템플릿 없이, 같은 원문 프롬프트를 base·instruct·사용자 모델 전부에 넣는다(객관식 로그우도가 이미 이 방식).
# 이 파일의 문구·예시·개수·정규화·가중치는 test 결과를 보기 전에 정했고, 바꾸면 새 판(version)으로 남긴다.
# 프롬프트가 의도대로 동작하는지(정지 문자열, 형식)는 dev 문항(gsm8k_ko_dev, scenario_dev)으로만 확인한다.
version: 1
registered_at: "2026-11-22"
decoding: {temperature: 0.0, thinking: off, max_model_len: 4096, seed: 1234}   # 공통 A와 같음

# U1. 로그우도 객관식 (lm-eval, kobench/standard/tasks/uni, 스위트 uni_mc_v1): 생성으로 풀던 객관식 4종을 선택지 문장 로그우도로.
#   선택지 글자가 아니라 선택지 문장 자체의 로그우도(cloze)라 위치·글자 편향이 없다. 0-shot, 원 선택지 순서.
#   대표 지표: acc_norm(선택지 바이트 길이 정규화). TruthfulQA MC1만 원 관례대로 acc.
mc_loglik:
  kormedmcqa_cloze: {format: "다음은 {subject} 국가시험 문제입니다.\n질문: {question}\n답:", metric: acc_norm, split: test}
  kobbq_cloze:      {format: "맥락: {context}\n질문: {question}\n답:", metric: acc_norm, split: evaluation-test}
  ko_truthful_cloze: {format: "질문: {question}\n답:", metric: acc, split: validation}
  k2_knowledge_cloze: {format: "질문: {question}\n답:", metric: acc_norm, split: knowledge}

# U2. few-shot 이어쓰기
fewshot:
  hrm8k:
    # 예시: GSM8K-ko train(HRM8K는 test 번역본이라 겹치지 않음)에서 결정적 해시 순서(uni_fewshot/i)로 뽑되 gsm8k_ko_dev 300개는 제외.
    # 해시 순서 앞쪽 8개 중 번역 오류(2146: 곱셈 기호 누락, 6448: 인원 수 불일치)와 지나치게 긴 문항(4788)은 사람이 확인해 뺐다.
    exemplar_train_index: [796, 377, 4570, 5164, 3040]
    # 각 예시 = 테스트와 같은 lm-eval hrm8k 문구(doc_to_text) + ' ' + 풀이(<<계산 주석>> 제거) + ' 최종 답: $\boxed{N}$'
    # 테스트 문항은 기존 gen 태스크의 문구 그대로 → 채점은 기존 exact_match_strict(\boxed 필수)
    joiner: "\n\n"
    stop: ["\n\n주어진 문제를", "\n주어진 문제를"]
    max_new: 2048
  kosimpleqa:
    # 직접 쓴 예시(KoSimpleQA 문항·정답과 겹치지 않음을 문자열 검색으로 확인). 채점은 기존 judge(SimpleQA 채점기)
    exemplars:
      - ["대한민국의 수도는 어디인가요?", "서울"]
      - ["물의 화학식은 무엇인가요?", "H2O"]
      - ["태양계에서 가장 큰 행성은 무엇인가요?", "목성"]
      - ["지구에서 가장 가까운 별은 무엇인가요?", "태양"]
      - ["평년의 1년은 며칠인가요?", "365일"]
    format: "질문: {q}\n답: {a}"
    joiner: "\n\n"
    stop: ["\n"]
    max_new: 128
  code:
    # HumanEval+·MBPP+ base 이어쓰기 형식(기존 raw 프롬프트·정지 문자열)을 instruct에도 그대로 적용
    source: gen_data raw + CODE_BASE_STOP
    max_new: 1024

# U3. 문맥 내 정렬(URIAL, Lin et al. 2023 "The Unlocking Spell on Base LLMs"): 고정 머리말 + 대화 예시 3개 뒤에 질문을 붙인다.
#   다턴은 앞 턴(모델 자신의 답)을 같은 형식으로 이어 붙인다. 예시는 직접 썼고 test 문항과 주제가 겹치지 않음을 확인했다.
urial:
  tasks: [ifeval_ko, komt, logickor, k2_generation, ko_arena_hard, scenario_self]
  preamble: "# 안내\n아래는 사용자와 AI 도우미의 대화입니다. 도우미는 사용자의 질문과 지시에 정확하고 도움이 되게 한국어로 답합니다. 지시에 형식이나 분량 조건이 있으면 그대로 따르고, 확실하지 않은 내용은 모른다고 말합니다."
  user_tag: "# 사용자:"
  assistant_tag: "# 도우미:"
  examples:
    - - "무지개가 생기는 원리를 초등학생이 이해할 수 있게 설명해 주세요."
      - "햇빛은 하얗게 보이지만 사실 빨강, 주황, 노랑, 초록, 파랑, 남색, 보라 같은 여러 색이 섞여 있어요. 비가 온 뒤 공기 중에 떠 있는 아주 작은 물방울에 햇빛이 들어가면, 색마다 꺾이는 정도가 조금씩 달라서 색이 서로 나뉘어요. 이렇게 나뉜 빛이 물방울 안에서 반사되어 우리 눈으로 돌아오면 하늘에 색깔 띠가 보이는데, 그게 무지개예요. 그래서 무지개는 해를 등지고 섰을 때 앞쪽 하늘에서 볼 수 있어요."
    - - "다음 문장을 존댓말로 바꿔서 한 문장으로만 쓰세요: 오늘 저녁에 같이 밥 먹을래?"
      - "오늘 저녁에 같이 식사하시겠어요?"
    - - "사과 3개가 2,400원일 때 사과 7개는 얼마인가요? 풀이 과정을 보여 주세요."
      - "사과 1개의 값은 2,400원 ÷ 3 = 800원입니다. 따라서 사과 7개의 값은 800원 × 7 = 5,600원입니다.\n\n답: 5,600원"
  stop: ["\n# 사용자:", "\n# 안내"]

# 통일 라인 태스크 목록 (gen 변형 U, 스위트 uni_v1) — U1은 run.py 스위트 uni_mc_v1
suite_gen: [hrm8k, kosimpleqa, humaneval_plus, mbpp_plus, ifeval_ko, komt, logickor, k2_generation, ko_arena_hard, scenario_self]

# 정규화와 종합 (보고서 계산 규칙)
normalize:
  mc: "무작위 보정 (acc - 1/선택지수) / (1 - 1/선택지수), 문항별 선택지 수 사용, 0 미만은 0"
  generation: "0~1 그대로 (정확도·통과율·승률)"
  judge_10: "점수 / 10 (KoMT·LogicKor 0~10, K2 생성 1~10은 (점수-1)/9)"
  ppl: "bits-per-byte → 최저(최고 성능) bpb / bpb"
  speed: "보고서 종합 점수에는 넣지 않고 품질 × 처리량 산점도로 따로 본다"
# 무작위 수준(객관식 무작위 보정용). 태스크 안 선택지 수가 섞인 경우 문항 가중 평균(kobest는 boolq·copa·sentineg·wic 2지, hellaswag 4지)
chance:
  kobest: 0.527
  kmmlu: 0.25
  haerae: 0.2
  click: 0.24          # 4~5지 혼합(근사)
  belebele_kor_Hang: 0.25
  global_mmlu_ko: 0.25
  kmmlu_redux: 0.25
  kmmlu_pro: 0.22      # 4~5지 혼합(근사)
  kobalt_700: 0.1
  hellaswag: 0.25
  arc_challenge: 0.25
  mmlu: 0.25
  winogrande: 0.5
  kormedmcqa_cloze: 0.2
  kobbq_cloze: 0.3333
  ko_truthful_cloze: 0.2261   # 문항별 1/선택지 수 평균
  k2_knowledge_cloze: 0.25
areas:     # 영역 = 태스크 평균, 종합 = 영역 단순 평균 (같은 가중치).
           # CI: 태스크별 문항 bootstrap 95% CI를 정규 근사로 합성(태스크 간 독립 가정) — 종합 점수의 대략적 불확실성
  지식:       [ko_mc_v1, ko_mc_ext_v1, en_mc_v1, k2_knowledge_cloze]
  전문·의료:  [kormedmcqa_cloze]
  사실성·편향: [ko_truthful_cloze, kobbq_cloze, kosimpleqa]
  수학:       [hrm8k]
  코드:       [humaneval_plus, mbpp_plus]
  지시 수행:  [ifeval_ko]
  대화·생성 품질: [komt, logickor, k2_generation, ko_arena_hard]
  다턴:       [scenario_self]
  언어 모델링: [ppl_wiki40b_ko]
