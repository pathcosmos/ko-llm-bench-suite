# 표준 벤치 모델 레지스트리 (kobench.standard)
# - path: 로컬 경로 또는 HF repo id. ${ENV} 확장 지원.
# - revision: HF commit SHA로 고정 (로컬 경로면 provenance 기록용)
# - kind: base | instruct  → 결과 표에서 같은 kind끼리 비교
# - backend: vllm | evafrill
# - params_b / active_b: 총/활성 파라미터(십억). dense는 같음.
# - owner: self = 사용자 모델
# 공개 모델 revision은 다운로드 시점에 `python -m kobench.standard.run --pin` 으로 채운다 (null = 미고정, 실행 거부).

models:
  # ── 사용자 모델 ──────────────────────────────────────────────────────────
  jansori-bf16:
    owner: self
    family: JANSORI
    kind: base
    backend: vllm
    path: ${JANSORI_BF16:-/home/work/llm-dense/llm-traditional/runs/3b_47k_hub_release_v1/nfs-release-v1/bf16}
    revision: e68bfa3cb31e9589f4481a2e31d6d75c731fec9d   # pathcosmos/JANSORI 배포 commit (NFS 사본 SHA 일치)
    params_b: 3.2
    active_b: 3.2
    max_length: 4096
  frankenstallm-bf16:
    owner: self
    family: FRANKENSTALLM
    kind: instruct            # SFT→ORPO
    backend: vllm
    path: pathcosmos/frankenstallm
    revision: b9f7777f01479b18e5a3a55f9cad4582df122f7d
    params_b: 3.0
    active_b: 3.0
    max_length: 4096
